name: Build

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@v3
      - name: Unit tests
        run: ./gradlew :antorch:testDebugUnitTest
      - name: Build demo
        run: ./gradlew :demo:assembleDebug
